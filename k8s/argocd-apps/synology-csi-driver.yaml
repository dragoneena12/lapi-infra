apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: synology-csi-driver
spec:
  project: default
  source:
    chart: synology-csi
    repoURL: https://christian-schlichtherle.github.io/synology-csi-chart
    targetRevision: 0.11.4
    helm:
      valuesObject:
        clientInfoSecret:
          create: false
        images:
          plugin:
            # v1.4.0 は btrfs 非対応（既存の iSCSI PV はすべて btrfs）、v1.3.1 からは DSM の証明書を検証するが
            # lapinas は自己署名証明書（CN=synology）なので、NFS に対応した v1.2.1 に固定する
            tag: v1.2.1
        storageClasses:
          # Helm テスト用の PVC が LUN を消費しないようにする
          iscsi-delete:
            test: false
          # DSM の共有フォルダは ACL で administrators のみ許可されていて、クライアントから chmod すると Unix の権限に切り替わる。
          # ドライバーは権限ビットが違うときだけ chmod するが、DSM は 0777 と報告するので 0777 だと chmod されない。
          # 2777 にすると v1.2.1 では毎回 chmod される（実際の権限は 0777）
          # https://github.com/SynologyOpenSource/synology-csi/issues/30
          nfs-delete:
            test: false
            parameters:
              protocol: nfs
              mountPermissions: "2777"
          nfs-retain:
            parameters:
              protocol: nfs
              mountPermissions: "2777"
          smb-delete:
            disabled: true
          smb-retain:
            disabled: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: synology-csi-driver
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
