apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: isucon-o11y-loki
spec:
  selector:
    matchLabels:
      app: isucon-o11y-loki
  serviceName: isucon-o11y-loki
  replicas: 1
  template:
    metadata:
      labels:
        app: isucon-o11y-loki
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
      - name: isucon-o11y-loki
        image: grafana/loki:3.7.8
        args:
        - -config.file=/etc/loki/config.yaml
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: data
          mountPath: /loki
        - name: config
          mountPath: /etc/loki
      volumes:
      - name: config
        configMap:
          name: isucon-o11y-loki
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: synology-csi-driver-nfs-retain
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: isucon-o11y-loki
spec:
  selector:
    app: isucon-o11y-loki
  ports:
  - port: 3100
    targetPort: 3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: isucon-o11y-loki
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
      - from: 2026-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

    # ベンチ中はアクセスログが短時間に集中するので取り込み上限を緩めにする
    limits_config:
      retention_period: 336h
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      per_stream_rate_limit: 16MB
      per_stream_rate_limit_burst: 32MB
      max_query_series: 10000
      allow_structured_metadata: true
      volume_enabled: true

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    analytics:
      reporting_enabled: false
