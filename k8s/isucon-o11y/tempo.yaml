apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: isucon-o11y-tempo
spec:
  selector:
    matchLabels:
      app: isucon-o11y-tempo
  serviceName: isucon-o11y-tempo
  replicas: 1
  template:
    metadata:
      labels:
        app: isucon-o11y-tempo
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
      - name: isucon-o11y-tempo
        image: grafana/tempo:3.1.0
        args:
        - -target=all
        - -config.file=/etc/tempo/tempo.yaml
        ports:
        - containerPort: 3200
          name: http
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        volumeMounts:
        - name: data
          mountPath: /var/tempo
        - name: config
          mountPath: /etc/tempo
      volumes:
      - name: config
        configMap:
          name: isucon-o11y-tempo
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: synology-csi-driver-nfs-retain
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: isucon-o11y-tempo
spec:
  selector:
    app: isucon-o11y-tempo
  ports:
  - name: http
    port: 3200
    targetPort: 3200
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: isucon-o11y-tempo
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    # span metrics / service graph を Prometheus に書き込む
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
        remote_write:
        - url: http://isucon-o11y-prometheus:9090/api/v1/write
          send_exemplars: true

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: ["span-metrics", "service-graphs"]

    usage_report:
      reporting_enabled: false
